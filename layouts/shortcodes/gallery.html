{{- /* Sourced photo gallery: horizontal scroll-snap slider + click-to-enlarge.
       Data-driven from data/gallery.yaml — every photo carries caption + source. */ -}}
<div class="gallery-slider" id="gallery">
{{ range site.Data.gallery.photos }}
  <figure class="gallery-item">
    <img src="{{ .src }}" alt="{{ .caption }}" loading="lazy" onclick="this.closest('figure').classList.toggle('zoomed')">
    <figcaption>
      <div class="g-caption">{{ .caption }}</div>
      <div class="g-source">{{ with .year }}{{ . }} · {{ end }}{{ .source }}</div>
    </figcaption>
  </figure>
{{ end }}
</div>
<div class="gallery-hint">← scroll → &middot; click a photo to enlarge</div>
<style>
.gallery-slider{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 16px;-webkit-overflow-scrolling:touch}
.gallery-item{flex:0 0 min(78%,520px);scroll-snap-align:center;margin:0;background:rgba(0,0,0,.14);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.gallery-item img{width:100%;height:330px;object-fit:cover;display:block;cursor:zoom-in;transition:filter .2s}
.gallery-item img:hover{filter:brightness(1.06)}
.gallery-item.zoomed{position:fixed;inset:0;z-index:99;background:rgba(10,8,6,.94);display:flex;flex-direction:column;justify-content:center;border-radius:0}
.gallery-item.zoomed img{height:auto;max-height:82vh;object-fit:contain;cursor:zoom-out}
.gallery-item figcaption{padding:10px 14px}
.g-caption{font-weight:bold}
.g-source{opacity:.65;font-size:.85em;margin-top:3px}
.gallery-hint{text-align:center;opacity:.55;font-size:.85em;margin-top:2px}
</style>
